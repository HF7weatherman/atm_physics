[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "atm_physics"
authors = [
    {name = "Henning Franke, MPI-M"},
]
dependencies = [
    "numpy",
    "xarray",
    "scipy",
    "grid_toolbox @ file:///home/m/m300738/libs/grid_toolbox",
]
description = "Toolbox containing functions for basic atmospheric physics calculations."
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
classifiers=[
    "Private :: Do Not Upload",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10"
]
dynamic = ["version"]

